# vslam.yaml — Master config for the cuVSLAM + nvblox stack.
#
# Consumed by uav_bringup/launch/vslam.launch.py.
# Flip values here, restart the stack; no code edits.

vslam:
  # Master switch. When false, vslam.launch.py emits no nodes — stack falls back
  # to the EKF2-only path with OctoMap mapping (handled by full_stack.launch.py).
  enable: false

  # ── cuVSLAM (isaac_ros_visual_slam) ─────────────────────────────────────
  cuvslam:
    # 0 = multicamera stereo (recommended for v1)
    # 1 = mono+depth fallback (RGBD only)
    tracking_mode: 0
    num_cameras: 2

    # Sim stereo pair is pinhole-perfect → no rectification needed.
    # For real D415, set false (driver delivers rectified rectified or raw?).
    rectified_images: true

    # IMU fusion: keep off until accel/gyro biases on the real platform are
    # calibrated. D415 has no IMU so this stays false in sim too.
    enable_imu_fusion: false

    # Input topic remaps (matches our sensor_bridge.yaml + stereo_camera_info_publisher).
    topics:
      image_0:       /drone/stereo/left/image
      image_1:       /drone/stereo/right/image
      camera_info_0: /drone/stereo/left/camera_info
      camera_info_1: /drone/stereo/right/camera_info
      imu:           /drone/imu          # only used if enable_imu_fusion=true

    # Frames
    map_frame:       map
    odom_frame:      odom
    base_frame:      base_link
    rectified_images_frame: rgbd_cam_link

  # ── nvblox dense mapping ────────────────────────────────────────────────
  # Set enable=false to run cuVSLAM standalone (useful for validating tracking
  # before fusing the dense map).
  nvblox:
    enable: true
    voxel_size: 0.05                     # metres
    mapping_type: static_tsdf             # static_tsdf | dynamic | human
    esdf_slice_min_height: 0.3            # metres above base
    esdf_slice_max_height: 1.8
    max_integration_distance_m: 5.0

    topics:
      depth_image:   /drone/rgbd/depth
      color_image:   /drone/rgbd/image
      camera_info:   /drone/rgbd/camera_info

  # ── PX4 vision feedback (Component H — deferred) ────────────────────────
  # When true, a separate vslam_to_px4_bridge node publishes cuVSLAM pose into
  # /fmu/in/vehicle_visual_odometry so PX4's EKF2 fuses it. Ships OFF; turn on
  # only after tracking is flight-validated.
  px4_feedback:
    enable: false
    publish_rate_hz: 30.0
    min_cov_position: 0.01
    min_cov_orientation: 0.001
    drop_when_not_tracking: true

  # ── Map persistence ─────────────────────────────────────────────────────
  persistence:
    map_dir: /scratch/$USER/irobot/maps    # expand $USER at launch time
    load_map_from: ""                      # set to env_name to auto-localize on boot

  # ── Semantic layer (Component I — deferred) ─────────────────────────────
  # Wired but disabled. Modes:
  #   nvblox_channel — semantic IDs stored as an extra nvblox layer
  #   keyframe_db    — semantic graph keyed off cuVSLAM keyframes
  #   off            — no semantic enrichment
  semantic:
    enable: false
    mode: nvblox_channel
