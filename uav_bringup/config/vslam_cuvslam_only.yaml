# vslam_cuvslam_only.yaml — Variant config for cuVSLAM standalone testing.
#
# Same shape as vslam.yaml; only nvblox.enable is flipped off. Use this when
# validating cuVSLAM tracking (vo_state, drift, TF) before adding dense mapping.
#
# Selected via:
#   ros2 launch uav_bringup vslam.launch.py \
#     vslam_config:=$(ros2 pkg prefix uav_bringup)/share/uav_bringup/config/vslam_cuvslam_only.yaml

vslam:
  enable: true

  cuvslam:
    tracking_mode: 2       # RGBD (matches vslam.yaml master)
    num_cameras: 1
    rectified_images: true
    enable_imu_fusion: false
    topics:
      image_0:       /drone/rgbd/image
      camera_info_0: /drone/rgbd/camera_info
      depth_0:       /drone/rgbd/depth
      imu:           /drone/imu
    map_frame:       map
    odom_frame:      odom
    base_frame:      base_link
    rectified_images_frame: rgbd_cam_link

  nvblox:
    enable: false       # ← key difference from vslam.yaml

  px4_feedback:
    enable: false

  persistence:
    map_dir: /scratch/$USER/irobot/maps
    load_map_from: ""

  semantic:
    enable: false
    mode: nvblox_channel
